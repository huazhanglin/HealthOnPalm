name: health_agent_app
description: 健康智能体 - AI 健康顾问应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由管理
  go_router: ^14.2.0

  # 网络请求
  dio: ^5.4.0
  retrofit: ^4.1.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2

  # 健康数据
  health: ^8.1.0

  # UI 组件
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.1
  dash_chat_2: ^0.2.7

  # 模型代码生成
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 工具库
  uuid: ^4.2.1
  intl: ^0.19.0
  url_launcher: ^6.2.3
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.0

  # 环境变量
  flutter_dotenv: ^5.1.0

  # Sentry (错误监控，可选)
  # sentry_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/fonts/
