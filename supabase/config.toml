# Supabase 本地配置（Edge Functions）
# 文档：https://supabase.com/docs/guides/cli/config

project_id = "zewznptbyhurxaqirzmb"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.mock-health-data]
verify_jwt = false

[functions.morning-brief]
verify_jwt = true

[functions.query-agent]
verify_jwt = true

[functions.memory-working]
verify_jwt = true

[functions.safety-check]
verify_jwt = false

[functions.sync-healthkit]
verify_jwt = true

[functions.speech-to-text]
verify_jwt = true

[functions.text-to-speech]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
